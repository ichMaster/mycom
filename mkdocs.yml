site_name: MyCom
site_description: A keyboard-first dual-panel TUI file manager in the spirit of FAR Manager, with an AI command palette and Claude Code integration
repo_url: https://github.com/ichMaster/mycom

theme:
  name: material
  palette:
    scheme: slate
    primary: teal

nav:
  - Home: index.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

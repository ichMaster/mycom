[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mycom"
version = "0.4.0"
description = "A modern dual-panel TUI file manager inspired by FAR Commander"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "textual>=0.80",
    "pyte>=0.8",
    "anthropic>=0.40",
]

[project.scripts]
mycom = "mycom.app:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "textual-dev>=1.0",
    "ruff>=0.8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
    "mkdocs-gen-files>=0.5",
    "mkdocs-literate-nav>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.coverage.run]
source = ["mycom"]

[tool.coverage.report]
show_missing = true
skip_empty = true

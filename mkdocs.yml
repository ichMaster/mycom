site_name: MyCom
site_description: A modern dual-panel TUI file manager inspired by FAR Commander
repo_url: https://github.com/ichMaster/mycom

theme:
  name: material
  palette:
    scheme: slate
    primary: teal

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - User Guide:
    - Configuration: configuration.md
    - Keybindings: keybindings.md
    - Navigation: navigation.md
  - Components:
    - Widgets: widgets.md
    - Panels: panels.md
    - Architecture: architecture.md
  - Development: development.md
  - API Reference: reference/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
